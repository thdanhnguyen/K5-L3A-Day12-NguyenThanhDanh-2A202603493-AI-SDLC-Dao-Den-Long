name: Phase Verification CI (Linux)

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
    branches: [main]

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build UI, Headless CLI & Run Phase 2 Verification
        run: npm run verify
